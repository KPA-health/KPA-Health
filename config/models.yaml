default_profile: qwen_local
profiles:
  qwen_local:
    enabled: true
    provider: ollama
    mode: chat
    base_url: http://127.0.0.1:11434
    model: qwen3:4b
    api_key_env: null
    output_mode: json_schema
    prompt_template: his_json_v1
    capabilities: {thinking: true, json_schema: true}
    generation:
      temperature: 0
      top_p: 0.9
      seed: 42
      context_window: 8192
      max_output_tokens: 768
      stop: []
      thinking: false
      keep_alive: 30m
    transport:
      connect_timeout_s: 2
      read_timeout_s: 15
      retries: 0
      verify_tls: true
    provider_options: {}
  sqlcoder_local:
    enabled: false
    provider: openai_compatible
    mode: completion
    base_url: http://127.0.0.1:8001/v1
    model: REPLACE_WITH_SERVER_MODEL_ID
    api_key_env: LOCAL_MODEL_API_KEY
    output_mode: sql_text
    prompt_template: sqlcoder_sqlite_v1
    capabilities: {thinking: false, json_schema: false}
    generation:
      temperature: 0
      max_output_tokens: 768
      stop: []
    provider_options: {}
  gemini_online:
    enabled: true
    provider: openai_compatible
    mode: chat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-1.5-flash
    api_key_env: GEMINI_API_KEY
    output_mode: json_schema
    prompt_template: gemini_sqlite_v1
    capabilities: {thinking: false, json_schema: true}
    generation:
      temperature: 0.1
    transport: {connect_timeout_s: 2, read_timeout_s: 30, retries: 0, verify_tls: true}
    provider_options: {}
